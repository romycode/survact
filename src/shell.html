<!-- Shared UI shell: used by index.html (dev) and by the single-file build. -->
<div class="app">
  <div class="stage"><canvas id="game"></canvas></div>
  <nav class="bar" aria-label="Controles">
    <div class="tools">
      <button type="button" data-key="Digit1" aria-pressed="true"><span class="sw wall"></span>Muro <small>$5</small><kbd>1</kbd></button>
      <button type="button" data-key="Digit2" aria-pressed="false"><span class="sw turret"></span>Torreta <small>$25</small><kbd>2</kbd></button>
      <button type="button" data-key="KeyX" aria-pressed="false"><span class="sw del"></span>Quitar<kbd>X</kbd></button>
    </div>
    <button type="button" class="go" data-key="Space">Empezar oleada<kbd>Espacio</kbd></button>
    <button type="button" class="go" data-key="KeyR" hidden>Reiniciar<kbd>R</kbd></button>
  </nav>
</div>
